[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meet-transcriptor"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "pydantic>=2.8",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "whisperx>=3.3.1",
    "torch>=2.4",
    "imageio-ffmpeg>=0.5.1",
    "python-docx>=1.1.2",
]

[project.optional-dependencies]
asr-whisperx = []
diar-pyannote = []
asr-parakeet = []
diar-nemotron = []

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requiere modelos reales y se ejecuta manualmente",
]
